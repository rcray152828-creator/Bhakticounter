<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BhaktiCounter V3</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ff9800">
</head>

<body>

<div class="container">

<h1>🕉 BhaktiCounter V3</h1>
<select id="languageSelect">
  <option value="en">🇬🇧 English</option>
  <option value="hi">🇮🇳 Hindi</option>
  <option value="or">🟢 Odia</option>
</select>
<h3 id="currentDate"></h3>

<select id="mantraSelect">
<option>🙏 जय जगन्नाथ</option>
<option>🦚 राधे राधे</option>
<option>🕉 ॐ नमः शिवाय</option>
<option>🪷 हरे कृष्ण</option>
<option>🚩 जय श्री राम</option>
</select>

<div class="counterBox">

<div id="count">0</div>

<p id="mantraText">🙏 जय जगन्नाथ</p>

<button id="tapBtn">📿 Tap For Jaap</button>

</div>
<script async="async" data-cfasync="false" src="https://pl30631357.effectivecpmnetwork.com/bd85f014fbf6e10d0b7af2ce7fbefce2/invoke.js"></script>
<div id="container-bd85f014fbf6e10d0b7af2ce7fbefce2"></div>
  
<div class="cards">

<div class="card">
<h2 id="today">0</h2>
<p>Today's Jaap</p>
</div>

<div class="card">
<h2 id="total">0</h2>
<p>Total Jaap</p>
</div>

<div class="card">
<h2 id="mala">0</h2>
<p>Total Mala</p>
</div>
<div class="card">
  <h2 id="dailyRecord">0</h2>
  <p>🏆 Daily Record</p>
</div>

<div class="card">
  <h2 id="historyDays">0</h2>
  <p>📅 History Days</p>
</div>
</div>

<div class="buttons">

<button onclick="shareResult()">📤 Share</button>

<button onclick="resetData()">🔄 Reset</button>

<button onclick="toggleTheme()">🌙 Theme</button>

</div>

<p class="footer">
Made with ❤️ for Devotees
</p>

</div>
<audio id="bellSound">
  <source src="bell.mp3" type="audio/mpeg">
</audio>
<script src="script.js"></script>
<script src="https://pl30631356.effectivecpmnetwork.com/55/3a/63/553a63404b2dedee579f54c0872b35f5.js"></script>

</body>
</html>
